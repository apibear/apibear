<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 64" role="img" aria-labelledby="title">
  <title id="title">API Bear</title>
  <!-- Horizontal lockup for light backgrounds. Mark = logo-mark.svg;
       wordmark = hand-built rounded geometric letters (7u monoline strokes,
       cap height 34u, x-height 25u), no fonts required. -->
  <g id="mark">
    <g stroke="#1c1917" stroke-width="4" stroke-linejoin="round" fill="#fbbf24">
      <rect id="ear-left" x="8" y="5" width="18" height="18" rx="5"/>
      <rect id="ear-right" x="38" y="5" width="18" height="18" rx="5"/>
      <rect id="head" x="4" y="14" width="56" height="46" rx="19"/>
    </g>
    <g fill="#1c1917">
      <circle cx="21" cy="34" r="4"/>
      <circle cx="43" cy="34" r="4"/>
      <rect x="21" y="40" width="22" height="15" rx="7.5" fill="#fef3c7"/>
      <rect x="27" y="42" width="10" height="6" rx="3"/>
    </g>
  </g>
  <g id="wordmark" transform="translate(80 1)" fill="none" stroke="#1c1917" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g id="word-api">
      <path id="A" d="M3.5 44.5 15 17.5 26.5 44.5M8 35H22"/>
      <path id="P" d="M37.5 44.5V17.5H47a8.5 8.5 0 0 1 0 17H37.5"/>
      <path id="I" d="M67.5 17.5V44.5"/>
    </g>
    <g id="word-bear" transform="translate(5 0)">
      <path id="B" d="M86.5 30.5H96a6.5 6.5 0 0 0 0-13H86.5V44.5H97a7 7 0 0 0 0-14"/>
      <path id="e" d="M115.5 35.5H133.5A9 9 0 1 0 130.9 41.9"/>
      <path id="a" d="M162.5 26.5V44.5M162.5 35.5A9 9 0 1 1 162.5 35.4"/>
      <path id="r" d="M173.5 44.5V26.5M173.5 35A8.5 8.5 0 0 1 182 26.5H184"/>
    </g>
  </g>
</svg>
